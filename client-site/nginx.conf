# Client-site serves the SPA AND reverse-proxies the API + payment routes to the gateway,
# so the browser uses a single origin (no CORS) — the production-realistic shape where the
# site and API live behind one domain. Local: http://127.0.0.1:5174 fronts everything.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs change whenever a container is recreated. Resolve the gateway
    # through Docker DNS at request time so a gateway deployment cannot leave Nginx
    # pinned to a dead container IP until the client-site is restarted.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $gateway_upstream http://gateway:8080;

    # Security headers on every response. HSTS is set by the outer TLS-terminating
    # proxy (Cloudflare) in production; uncomment here only if this layer terminates TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: app/API stay same-origin; Clerk needs its hosted JS, API calls, and auth frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; img-src 'self' data: https://img.clerk.com https://*.clerk.accounts.dev; font-src 'self' data: https://fonts.gstatic.com https://api.fontshare.com https://cdn.fontshare.com; media-src 'self' blob:; connect-src 'self' https://*.clerk.accounts.dev; frame-src https://*.clerk.accounts.dev; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # OpenAI-compatible API (streaming-safe: buffering off for SSE).
    location /v1/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The visible success page is React-owned so it can match the client-site suite UI.
    # It fetches the one-time gateway payload through /gateway-payment/success below.
    location = /payment/success {
        try_files $uri /index.html;
    }

    # Internal frontend fetch path for the gateway's one-time success payload.
    location /gateway-payment/ {
        rewrite ^/gateway-payment/(.*)$ /payment/$1 break;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment webhook and any non-success payment routes remain gateway-owned.
    location /payment/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { proxy_pass $gateway_upstream; }
    location = /readyz  { proxy_pass $gateway_upstream; }

    # Payment success helper JS is served by the gateway via go:embed. The
    # success HTML loads /static/copy-config.js and CSP allows same-origin
    # scripts only, so the client-site proxy must forward this path too.
    location /static/ {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
